<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Object Detection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #07110f url("static/bg.jpg") center center / cover no-repeat fixed;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      z-index: 0;
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: min(1000px, calc(100% - 32px));
      margin: 32px auto 64px;
      padding: 32px 24px;
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: rgba(20, 20, 20, 0.66);
      box-shadow: 0 0 50px rgba(0, 255, 200, 0.16);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00ffe1, #00b3ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .lede { color: #d5d5d5; margin-bottom: 22px; }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    button, label.upload-btn {
      background: linear-gradient(90deg, #00ffae, #00b3ff);
      color: #04120f;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
    label.upload-btn { display: inline-block; }
    input[type="file"] { display: none; }
    #status { min-height: 1.4em; color: #b7fff2; margin-bottom: 14px; }
    .stage {
      display: none;
      position: relative;
      width: 100%;
      border-radius: 15px;
      overflow: hidden;
      border: 3px solid #00ffe1;
    }
    canvas, video { width: 100%; height: auto; display: block; background: #000; }
    video.hidden-source { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #cfcfcf;
      padding-bottom: 24px;
    }
    footer a { color: #00ffae; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <main class="wrap">
    <h1>Real-Time Object Detection</h1>
    <p class="lede">Open the camera or drop in a photo or video. Boxes are drawn in this browser, so the page works without a Python server.</p>
    <div class="buttons">
      <button type="button" id="start">Start camera</button>
      <label for="image-upload" class="upload-btn">Upload image</label>
      <label for="video-upload" class="upload-btn">Upload video</label>
      <button type="button" id="stop">Stop</button>
    </div>
    <input type="file" id="image-upload" accept="image/*" />
    <input type="file" id="video-upload" accept="video/*" />
    <p id="status">Loading the detection model…</p>
    <div class="stage" id="stage">
      <video id="source" class="hidden-source" playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>
  </main>
  <footer>
    <p>Live demo runs COCO-SSD in the browser. The Python files in this repo still run YOLOv5 and YOLOv8 locally.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("canvas");
    const source = document.getElementById("source");
    const ctx = canvas.getContext("2d");
    let model = null;
    let running = false;
    let camera = null;
    let loopId = 0;

    function setStatus(text) { statusEl.textContent = text; }

    async function readyModel() {
      if (!model) {
        setStatus("Loading the detection model…");
        model = await cocoSsd.load();
      }
      return model;
    }

    function drawPredictions(predictions) {
      ctx.lineWidth = 3;
      ctx.font = "16px Segoe UI, sans-serif";
      predictions.forEach((item) => {
        const [x, y, w, h] = item.bbox;
        ctx.strokeStyle = "#00ffe1";
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.strokeRect(x, y, w, h);
        const label = `${item.class} ${Math.round(item.score * 100)}%`;
        const width = ctx.measureText(label).width + 12;
        ctx.fillRect(x, Math.max(0, y - 24), width, 24);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(label, x + 6, Math.max(16, y - 6));
      });
    }

    function paint(media) {
      const width = media.videoWidth || media.naturalWidth;
      const height = media.videoHeight || media.naturalHeight;
      if (!width || !height) return;
      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(media, 0, 0, width, height);
    }

    async function detectOnce(media) {
      const detector = await readyModel();
      paint(media);
      const predictions = await detector.detect(canvas);
      drawPredictions(predictions);
      setStatus(predictions.length ? `${predictions.length} object${predictions.length === 1 ? "" : "s"} found.` : "No objects in this frame.");
      stage.style.display = "block";
    }

    async function loop() {
      if (!running) return;
      if (source.readyState >= 2) await detectOnce(source);
      loopId = window.setTimeout(loop, 180);
    }

    function stopTracks() {
      running = false;
      window.clearTimeout(loopId);
      if (camera) {
        camera.getTracks().forEach((track) => track.stop());
        camera = null;
      }
      source.pause();
      source.srcObject = null;
      if (source.src) {
        URL.revokeObjectURL(source.src);
        source.removeAttribute("src");
      }
    }

    document.getElementById("start").addEventListener("click", async () => {
      try {
        stopTracks();
        camera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        source.srcObject = camera;
        await source.play();
        running = true;
        stage.style.display = "block";
        setStatus("Camera on.");
        loop();
      } catch (error) {
        setStatus("Camera could not start. Allow camera access, or upload a photo instead.");
      }
    });

    document.getElementById("stop").addEventListener("click", () => {
      stopTracks();
      stage.style.display = "none";
      setStatus("Stopped.");
    });

    document.getElementById("image-upload").addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      stopTracks();
      const image = new Image();
      image.onload = () => detectOnce(image).catch(() => setStatus("Could not read that image."));
      image.onerror = () => setStatus("Could not read that image.");
      image.src = URL.createObjectURL(file);
    });

    document.getElementById("video-upload").addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      try {
        stopTracks();
        source.src = URL.createObjectURL(file);
        await source.play();
        running = true;
        stage.style.display = "block";
        loop();
      } catch (error) {
        setStatus("Could not play that video.");
      }
    });

    readyModel()
      .then(() => setStatus("Model ready. Start the camera or upload a file."))
      .catch(() => setStatus("The detection model did not load. Check the network and refresh."));
  </script>
</body>
</html>
